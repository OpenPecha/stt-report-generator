name: Daily STT Report Generation and SRT File Creation

on:
  schedule:
    - cron: '0 17 * * *'  # Every day at 5PM UTC
  workflow_dispatch:      # Allow manual trigger from GitHub

jobs:
  generate-report-and-srt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create reports directory
        run: mkdir -p reports/srt_output

      - name: Run report generation script
        env:
          HOST: ${{ secrets.HOST }}
          DBNAME: ${{ secrets.DBNAME }}
          DBUSER: ${{ secrets.DBUSER }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          python generate_report.py

      - name: Run SRT file generation script
        run: |
          python generate_srt_files.py

      - name: Commit and push updated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "📊 Daily STT report and SRT files update $(date +%Y-%m-%d)"
          git push
